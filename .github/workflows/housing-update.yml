name: housing-update

on:
  schedule:
    # 08:17, 12:17, 20:17 Asia/Seoul (UTC times below).
    - cron: "17 23 * * *"
    - cron: "17 3 * * *"
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (no email or commit)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: housing-update-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAIL_SUBSCRIBERS: ${{ secrets.MAIL_SUBSCRIBERS }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
      SITE_URL: ${{ vars.SITE_URL }}
      MAIL_COPY_TO: ${{ secrets.MAIL_COPY_TO }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate delivery configuration
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        shell: bash
        run: |
          if [[ -z "$MAIL_SUBSCRIBERS" || -z "$SMTP_USER" || -z "$SMTP_PASS" ]]; then
            echo "::error::Required Actions secrets are missing: MAIL_SUBSCRIBERS, SMTP_USER or SMTP_PASS."
            exit 1
          fi
      - name: Collect public housing notices
        run: python export_web.py --geo-budget 80
      - name: Prepare and send updates
        shell: bash
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            python digest.py --dry-run
          else
            python digest.py
          fi
      - name: Commit public notice data and notice-only state
        if: ${{ success() && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/notices.json data/schedule.ics data/geocache.json state/digest_state.json
          if git diff --cached --quiet; then
            echo "No updated public data to commit."
            exit 0
          fi
          git commit -m "data: update housing notices and change baseline"
          git pull --rebase origin main
          git push origin HEAD:main
